name: servicerca
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment: {POSTGRES_DB: "${POSTGRES_DB:-servicerca}", POSTGRES_USER: "${POSTGRES_USER:-servicerca}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-servicerca}"}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 15}
    networks: {servicerca: {ipv4_address: 172.28.0.5}}
  ceph:
    image: quay.io/ceph/demo:latest
    privileged: true
    environment: {MON_IP: 172.28.0.10, CEPH_PUBLIC_NETWORK: 172.28.0.0/16, DEMO_DAEMONS: "mon,mgr,osd,rgw", RGW_FRONTEND_PORT: 8000, CEPH_DEMO_UID: "${S3_ACCESS_KEY:-servicerca}", CEPH_DEMO_ACCESS_KEY: "${S3_ACCESS_KEY:-servicerca}", CEPH_DEMO_SECRET_KEY: "${S3_SECRET_KEY:-servicerca-secret}"}
    ports: ["8000:8000"]
    volumes: [ceph-data:/var/lib/ceph]
    networks: {servicerca: {ipv4_address: 172.28.0.10}}
  backend:
    build: ..
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      DB_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:-servicerca}"
      DB_USER: "${POSTGRES_USER:-servicerca}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-servicerca}"
      JWT_SECRET: "${JWT_SECRET:-change-this-development-secret-with-at-least-32-characters}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:4200}"
      DEMO_DATA_ENABLED: "${DEMO_DATA_ENABLED:-true}"
      S3_ENDPOINT: http://ceph:8000
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-servicerca}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-servicerca-secret}"
      S3_BUCKET: "${S3_BUCKET:-servicerca}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-disabled}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-disabled}"
    depends_on: {db: {condition: service_healthy}}
    ports: ["8080:8080"]
    networks: [servicerca]
  frontend:
    build: ../../serviciosFrontend
    depends_on: {backend: {condition: service_healthy}}
    ports: ["4200:8080"]
    networks: [servicerca]
volumes: {postgres-data: {}, ceph-data: {}}
networks: {servicerca: {ipam: {config: [{subnet: 172.28.0.0/16}]}}}
