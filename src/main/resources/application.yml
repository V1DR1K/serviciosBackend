spring:
  application.name: servicerca-api
  profiles.active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servicerca}
    username: ${DB_USER:servicerca}
    password: ${DB_PASSWORD:servicerca}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
  servlet.multipart:
    max-file-size: 8MB
    max-request-size: 24MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp.auth: ${SMTP_AUTH:false}
    properties.mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  security.oauth2.client.registration.google:
    client-id: ${GOOGLE_CLIENT_ID:disabled}
    client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
    scope: openid,email,profile
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html
app:
  mail-from: ${MAIL_FROM:no-reply@servicerca.com}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  demo-data-enabled: ${DEMO_DATA_ENABLED:false}
  jwt-secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
  encryption-key: ${ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8000}
    access-key: ${S3_ACCESS_KEY:servicerca}
    secret-key: ${S3_SECRET_KEY:servicerca-secret}
    bucket: ${S3_BUCKET:servicerca}
    region: ${S3_REGION:us-east-1}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
